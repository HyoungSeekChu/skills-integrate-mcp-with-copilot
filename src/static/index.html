<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <button id="account-button" class="account-button" type="button" aria-expanded="false" aria-controls="account-menu">
        <i data-lucide="user-round"></i>
        <span id="account-label">Teacher login</span>
      </button>
      <div id="account-menu" class="account-menu hidden">
        <button id="open-login-button" type="button">Log in</button>
        <button id="logout-button" class="hidden" type="button">Log out</button>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Register a Student</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <dialog id="login-dialog">
      <form id="login-form" method="dialog">
        <div class="dialog-heading">
          <h3>Teacher login</h3>
          <button id="close-login-button" class="icon-button" type="button" aria-label="Close login dialog">
            <i data-lucide="x"></i>
          </button>
        </div>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <p id="login-error" class="error hidden"></p>
        <button type="submit">Log in</button>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
